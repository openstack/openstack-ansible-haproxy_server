- name: Roll back modified configuration files # noqa: no-handler
  ansible.builtin.copy:
    src: "{{ item.backup_file }}"
    dest: "{{ item.dest }}"
    remote_src: true
    mode: "0640"
  loop: "{{ _haproxy_service_backup_files | selectattr('changed') }}"

- name: Remove newly created invalid configuration files  # noqa: no-handler
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: >-
    {{
      haproxy_service_change.results | default([])
      | selectattr('changed')
      | rejectattr('backup_file', 'defined')
      | selectattr('dest', 'defined')
    }}

- name: Cleanup backup files
  ansible.builtin.file:
    path: "{{ item.backup_file }}"
    state: absent
  loop: "{{ _haproxy_service_backup_files }}"

- name: Raise error due to assembly failure
  ansible.builtin.fail:
    msg: "Failed to assemble haproxy configuration: {{ assemble_result.msg
      | default('Unknown error') }}"
