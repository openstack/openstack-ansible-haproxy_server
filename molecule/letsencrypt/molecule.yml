---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: "haproxy-${MOLECULE_SCENARIO_NAME}"
    image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
    command: ${DOCKER_COMMAND:-""}
    pre_build_image: true
    privileged: true
    groups:
      - service_hosts

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  playbooks:
    prepare: ../../tests/prepare_letsencrypt.yml
    converge: ../../tests/test_letsencrypt.yml
    verify: ../../tests/verify_letsencrypt.yml
  config_options:
    defaults:
      inject_facts_as_vars: false

scenario:
  name: letsencrypt
